<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천국고시 모의고사 (계 1~11장)</title>
<style>
:root{--p:#3b5998;--bg:#f4f6f8;--card:#fff;--txt:#333;--sub:#888;--blank-bg:#e9ecef;--hint-bg:#fff3cd;--hint-c:#888;--ans-bg:#d1e7dd;--ans-c:#0f5132;--sec-bg:#eef2ff;--sec-bd:#c7d2fe;--red:#e53e3e}
[data-theme=dark]{--p:#8ab4f8;--bg:#202124;--card:#303134;--txt:#e8eaed;--sub:#aaa;--blank-bg:#5f6368;--hint-bg:#423805;--hint-c:#e2b838;--ans-bg:#0c3b28;--ans-c:#8ab4f8;--sec-bg:#1a1f3a;--sec-bd:#3730a3;--red:#fc8181}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:16px;line-height:1.6;transition:.3s}
.wrap{max-width:800px;margin:0 auto;padding-bottom:60px}
h1{color:var(--p);font-size:1.6rem;margin:0 0 6px}
.sub{color:var(--sub);font-size:.9rem;margin:0 0 14px}

/* ── 선택 모달 ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border-radius:16px;padding:28px 24px;width:90%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal-box h2{margin:0 0 6px;color:var(--p);font-size:1.2rem}
.modal-box p{margin:0 0 20px;font-size:.9rem;color:var(--sub)}
.exam-btn-list{display:flex;flex-direction:column;gap:10px}
.exam-btn{padding:14px 18px;border-radius:10px;border:2px solid var(--p);background:var(--card);color:var(--p);font-size:1rem;font-weight:bold;font-family:inherit;cursor:pointer;text-align:left;transition:.2s}
.exam-btn:hover{background:var(--p);color:#fff}
.stage-group{margin-bottom:14px}
.stage-group:last-child{margin-bottom:0}
.stage-lbl{font-size:.82rem;font-weight:bold;color:var(--p);margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--blank-bg)}

/* ── 모드 탭 ── */
.mode-tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:9px 14px;border:2px solid var(--blank-bg);border-radius:24px;background:var(--card);color:var(--txt);cursor:pointer;font-weight:bold;font-family:inherit;font-size:.9rem;transition:.2s;white-space:nowrap}
.tab.active{background:var(--p);color:#fff;border-color:var(--p)}
.tab-bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── 버튼 ── */
button{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-family:inherit;font-size:.88rem;transition:transform .1s}
button:active{transform:scale(.97)}
.btn-dark{background:#343a40;color:#fff}
.btn-gray{background:#6c757d;color:#fff}
.btn-hint{background:#ffc107;color:#333}
.btn-ans{background:#198754;color:#fff}
.btn-ans.on{background:#0f5132}
.btn-change{background:var(--p);color:#fff}
.btn-submit{background:var(--red);color:#fff;width:100%;padding:15px;font-size:1.05rem;border-radius:12px;margin-top:18px}
.btn-retry{background:var(--p);color:#fff;padding:11px 28px;border-radius:10px;font-size:.95rem;margin-top:10px}
[data-theme=dark] .btn-hint{background:#9c7b17;color:#eee}
[data-theme=dark] .btn-ans{background:#125838;color:#eee}

/* ── 섹션 헤더 ── */
.sec-hd{background:var(--sec-bg);border-left:4px solid var(--sec-bd);padding:10px 14px;border-radius:0 8px 8px 0;margin:26px 0 12px}
.sec-hd h2{margin:0;color:var(--p);font-size:1.05rem}
.sec-hd p{margin:3px 0 0;font-size:.82rem;color:var(--sub)}

/* ── 학습 카드 ── */
.card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.qlabel{font-weight:bold;font-size:1rem;color:var(--p);border-bottom:2px solid var(--blank-bg);padding-bottom:7px;margin-bottom:10px}
.qbody{font-size:1.02rem;line-height:1.9;word-break:keep-all;margin-bottom:12px}
.hint-ln{font-size:.88rem;color:var(--sub);margin-bottom:6px}
.hint-ln strong{color:var(--p)}
.ans-block{display:none;background:var(--ans-bg);color:var(--ans-c);border-radius:8px;padding:10px 13px;margin-bottom:10px;font-size:1rem;line-height:1.9;word-break:keep-all;animation:fi .2s ease}
.ans-block.show{display:block}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.blank{display:inline-block;min-width:36px;padding:2px 5px;margin:1px;border-bottom:2px solid var(--p);color:transparent;background:var(--blank-bg);border-radius:4px;cursor:pointer;font-weight:bold;text-align:center;user-select:none;touch-action:manipulation;white-space:nowrap}
.blank.hint{color:var(--hint-c);background:var(--hint-bg)}
.blank.ans{color:var(--ans-c);background:var(--ans-bg);border-bottom-color:transparent}
.card-ctrl{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}

/* ── 모의고사 카드 ── */
.ecard{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.eqlabel{font-weight:bold;font-size:1rem;color:var(--p);border-bottom:2px solid var(--blank-bg);padding-bottom:7px;margin-bottom:10px}
.line-inp{width:100%;border:none;border-bottom:2px solid var(--red);background:transparent;color:var(--txt);font-size:1rem;font-family:inherit;padding:5px 2px;outline:none;transition:.2s}
.line-inp:focus{border-bottom:3px solid var(--p);background:var(--hint-bg);border-radius:4px 4px 0 0}
.vhint{font-size:.88rem;color:var(--sub);margin-bottom:6px}
.vhint strong{color:var(--p)}
.vtarea{width:100%;border:2px solid var(--blank-bg);border-radius:8px;background:var(--bg);color:var(--txt);font-size:1rem;font-family:inherit;padding:9px 12px;outline:none;resize:vertical;line-height:1.8;transition:.2s}
.vtarea:focus{border-color:var(--p);background:var(--card)}
[data-theme=dark] .vtarea{background:#2a2d30}
.binp{display:inline-block;border:none;border-bottom:2px solid var(--red);background:transparent;color:var(--red);font-size:.97rem;font-family:inherit;font-weight:bold;text-align:center;outline:none;padding:1px 4px;margin:1px;vertical-align:middle;transition:.2s}
.binp:focus{border-bottom:3px solid var(--p);background:var(--hint-bg);border-radius:3px 3px 0 0}
.ev-body{font-size:1rem;line-height:2.2;word-break:keep-all}

/* ── 결과 ── */
.result-card{background:var(--card);border-radius:16px;padding:28px;box-shadow:0 6px 20px rgba(0,0,0,.1);text-align:center;margin-bottom:18px}
.score-big{font-size:3.5rem;font-weight:bold;color:var(--red);margin:14px 0}
.score-big.perfect{color:#198754}
.score-lbl{font-size:1rem;color:var(--sub)}
.wrong-sec{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.wrong-sec h3{margin:0 0 12px;color:var(--p);font-size:1rem;border-bottom:2px solid var(--blank-bg);padding-bottom:7px}
.wi{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--blank-bg);font-size:.93rem;line-height:1.8}
.wi:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.wlabel{font-weight:bold;color:var(--red);margin-bottom:3px}
.ok-b{display:inline-block;background:rgba(25,135,84,.1);color:#198754;border-radius:5px;padding:1px 7px;font-size:.82rem;font-weight:bold}
.fail-b{display:inline-block;background:rgba(229,62,62,.1);color:var(--red);border-radius:5px;padding:1px 7px;font-size:.82rem;font-weight:bold}
.corr{color:#198754;font-weight:bold;background:rgba(25,135,84,.1);padding:1px 5px;border-radius:4px}
.wrong-ans{color:#d9534f;text-decoration:line-through;font-size:.88em}
.ans-box{font-size:.9rem;color:var(--ans-c);background:var(--ans-bg);border-radius:6px;padding:7px 10px;margin-top:4px;line-height:1.8}

#topBtn{display:none;position:fixed;bottom:28px;left:28px;z-index:998;background:var(--p);color:#fff;border:none;cursor:pointer;padding:12px;border-radius:50%;width:48px;height:48px;font-size:1.1rem;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.sec-hd.collapsible{cursor:pointer;user-select:none;}
.sec-hd.collapsible:hover{opacity:.82;}
.sec-body.collapsed{display:none;}
.caret{float:right;font-size:.85rem;margin-top:2px;}

.pdf-divider{font-size:.88rem;color:var(--sub);margin:22px 0 10px;padding-top:14px;border-top:1px dashed var(--blank-bg)}

/* ── 틀린 부분 찾기 ── */
.sp-note{font-size:.88rem;color:var(--sub);margin:2px 0 14px;line-height:1.6}
.sp-note b{color:var(--p)}
.sp-body{font-size:1.04rem;line-height:2.4;word-break:keep-all}
.tk{cursor:pointer;border-bottom:1px dashed var(--sub);padding:0 2px;border-radius:3px;transition:background .15s,color .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tk:hover{background:var(--hint-bg)}
.tk.flag{background:rgba(229,62,62,.16);color:var(--red);font-weight:bold;border-bottom:2px solid var(--red)}
.tk.locked{cursor:default;border-bottom-color:transparent}
.tk.ok-correct{background:rgba(25,135,84,.18);color:#198754;font-weight:bold;border-bottom-color:transparent}
.tk.missed{background:rgba(229,62,62,.16);color:var(--red);font-weight:bold;border-bottom-color:transparent}
.tk.falsepos{background:rgba(255,193,7,.28);color:#9c7b17;font-weight:bold;border-bottom-color:transparent}
.tk s{opacity:.65}
.corr-note{font-size:.8em;font-weight:bold}
.sp-summary{background:var(--card);border-radius:16px;padding:24px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.1);margin-bottom:16px}
.sp-summary .big{font-size:3rem;font-weight:bold;margin:10px 0}

@media print {
  @page { size: A4; margin: 18mm 20mm; }

  /* UI 전체 숨김 */
  header, #topBar, #topBar2, .modal,
  #studyView, #spView, .btn-submit,
  #topBtn, button { display: none !important; }

  /* nav.js 처음으로 버튼 */
  body > button, [style*="position:fixed"], #partialBtn { display: none !important; }

  body {
    background: #fff !important;
    color: #000 !important;
    font-size: 10pt;
    padding: 0;
    margin: 0;
  }

  #examView {
    display: block !important;
  }

  /* 카드 */
  .ecard {
    background: #fff !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    padding: 6pt 0 8pt !important;
    margin-bottom: 0 !important;
    border-bottom: 0.5pt solid #ddd !important;
    page-break-inside: avoid;
  }

  .eqlabel {
    font-weight: bold;
    font-size: 10pt;
    color: #000 !important;
    margin-bottom: 4pt;
  }

  .ev-body { line-height: 2.2; font-size: 10pt; }

  /* 구분선 */
  .pdf-divider {
    color: #000 !important;
    font-size: 9pt;
    border-top: 0.5pt solid #aaa !important;
    margin: 12pt 0 6pt !important;
    padding-top: 8pt !important;
  }

  /* 단계 구분 헤더 */
  .sec-hd {
    background: #f2f2f2 !important;
    border-left: 3pt solid #333 !important;
    page-break-after: avoid;
    margin: 10pt 0 6pt !important;
  }
  .sec-hd h2 { color: #000 !important; font-size: 11pt !important; }

  /* 힌트 줄 */
  .vhint { font-size: 9pt; color: #555 !important; }

  /* 장 제목 입력 — 밑줄 */
  .line-inp {
    display: block !important;
    border: none !important;
    border-bottom: 0.8pt solid #000 !important;
    background: transparent !important;
    color: transparent !important;
    width: 100% !important;
    height: 16pt;
    padding: 0 !important;
    margin-top: 4pt;
  }

  /* 성구 기록 — 줄 쳐진 빈 공간 */
  .vtarea {
    display: block !important;
    border: 0.5pt solid #bbb !important;
    border-radius: 0 !important;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0pt, transparent 17pt,
      #ccc 17pt, #ccc 18pt
    ) !important;
    color: rgba(0,0,0,.15) !important;
    width: 100% !important;
    min-height: 72pt !important;
    resize: none !important;
    box-sizing: border-box;
    padding: 2pt 4pt !important;
    font-size: 9pt;
  }

  /* 빈칸 인풋 — 밑줄 */
  .binp {
    display: inline-block !important;
    border: none !important;
    border-bottom: 0.8pt solid #000 !important;
    background: transparent !important;
    color: transparent !important;
    font-size: 10pt;
    vertical-align: middle;
  }

  /* 정답 포함 인쇄 */
  body.print-with-answers .binp {
    color: #c00 !important;
    font-weight: bold !important;
    width: auto !important;
    min-width: 2em;
    padding: 0 3pt !important;
  }
  body.print-with-answers .line-inp {
    color: #c00 !important;
    font-weight: bold !important;
  }
  body.print-with-answers .vtarea {
    color: #c00 !important;
    background: none !important;
    border: 0.5pt solid #bbb !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📝 천국고시 모의고사</h1>
  <p class="sub">계 1~11장 · 1~3단계 · 4단계</p>
  <div class="tab-bar" id="topBar" style="display:none">
    <div class="mode-tabs">
      <button class="tab active" id="tabS" onclick="setMode('study')">📖 학습</button>
      <button class="tab" id="tabE" onclick="setMode('exam')">📝 모의고사</button>
      <button class="tab" id="tabP" onclick="setMode('spot')">🔍 틀린 부분 찾기</button>
    </div>
    <div class="ctrl-row">
      <button class="btn-gray" onclick="showModal()">📋 문제지 선택</button>
      <button class="btn-dark" onclick="toggleTheme()">🌙</button>
      <button class="btn-gray" id="globalBtn" onclick="toggleAll()">👁️ 전체 보기</button>
      <button class="btn-change" onclick="showHist()">📊 기록</button>
      <button class="btn-gray" onclick="location.reload()" title="새로고침 (최신 내용 받기)">🔄</button>
      <button class="btn-gray" id="printBtn" onclick="window.print()" style="display:none" title="A4 인쇄 (정답 없음)">🖨️ 인쇄</button>
      <button class="btn-gray" id="printAnsBtn" onclick="printWithAnswers()" style="display:none;background:#c0392b;color:#fff;" title="A4 인쇄 (정답 포함)">🖨️ 정답포함</button>
    </div>
  </div>
  <div class="ctrl-row" id="topBar2">
    <button class="btn-dark" onclick="toggleTheme()">🌙 다크 모드</button>
  </div>
</header>

<!-- ── 선택 모달 ── -->
<div class="modal" id="selModal">
  <div class="modal-box">
    <h2>📋 문제지 선택</h2>
    <p>풀고 싶은 모의고사를 선택하세요.</p>
    <div class="exam-btn-list">
      <button class="exam-btn" onclick="selectStage('1')">1단계 · 계 1~2장</button>
      <button class="exam-btn" onclick="selectStage('2')">2단계 · 계 1~5장</button>
      <button class="exam-btn" onclick="selectStage('3')">3단계 · 계 1~8장</button>
      <button class="exam-btn" onclick="selectStage('4')">4단계 · 계 1~11장</button>
    </div>
    <button class="btn-gray" onclick="showHist()" style="width:100%;margin-top:16px">📊 지난 시험 기록 보기</button>
    <button class="btn-gray" onclick="location.reload()" style="width:100%;margin-top:8px;background:#5a6268">🔄 새로고침 (최신 내용 받기)</button>
  </div>
</div>

<!-- ── 기록 모달 ── -->
<div class="modal" id="histModal" style="display:none">
  <div class="modal-box">
    <h2>📊 시험 기록</h2>
    <p>최근 기록부터 표시됩니다. (이 기기에만 저장)</p>
    <div id="histBody" style="max-height:52vh;overflow:auto"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-gray" style="flex:1" onclick="clearHist()">🗑️ 기록 지우기</button>
      <button class="btn-change" style="flex:1" onclick="hideHist()">닫기</button>
    </div>
  </div>
</div>

<!-- ── 학습 ── -->
<div id="studyView" style="display:none">
  <div id="s-body"></div>
</div>

<!-- ── 모의고사 ── -->
<div id="examView" style="display:none">
  <div id="e-body"></div>
  <button class="btn-submit" onclick="submitExam()">📩 답안 제출</button>
</div>

<!-- ── 틀린 부분 찾기 ── -->
<div id="spotView" style="display:none">
  <div id="sp-summary"></div>
  <p class="sp-note">🔍 정답처럼 보이지만 <b>일부 핵심 단어가 틀리게</b> 바뀌어 있습니다. 틀렸다고 생각하는 단어를 눌러 표시한 뒤 <b>채점하기</b>를 누르세요.</p>
  <div id="sp-body"></div>
  <button class="btn-submit" id="spSubmitBtn" onclick="submitSpot()">🔍 채점하기</button>
</div>

<!-- ── 결과 ── -->
<div id="resultView" style="display:none">
  <div class="result-card">
    <div class="score-lbl">총 <span id="rTotal"></span>문항 중</div>
    <div class="score-big" id="rScore"></div>
    <div id="rMsg" style="margin-bottom:6px"></div>
    <div id="rPartialNote" style="font-size:0.82rem;color:#888;margin-bottom:14px"></div>
    <button class="btn-retry" onclick="retryExam()">🔄 다시 도전</button>
  </div>
  <div id="rRecent"></div>
  <div id="wrongList"></div>
</div>
</div>
<button id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆</button>
<button id="partialBtn" onclick="submitPartial()" style="display:none;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9998;background:#3b5998;color:#fff;border:none;cursor:pointer;padding:12px 22px;border-radius:24px;font-size:.9rem;font-weight:bold;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap;">📊 푼 문제만 채점하기</button>

<script>
window.onscroll=()=>{ document.getElementById('topBtn').style.display=(scrollY>300?'block':'none'); };
if(localStorage.getItem('theme')==='dark') document.documentElement.setAttribute('data-theme','dark');

// ─── 데이터 ───────────────────────────────────────────────────────────────────
const EXAMS = {
'1-1':{
  label:'1단계(1) · 계 1장', total:20,
  titleData:[
    {num:1, q:'계 1:1~8의 제목을 기록하시오.', a:'계시록 전장의 요약과 결론'},
    {num:2, q:'계 1:9~20의 제목을 기록하시오.', a:'계시록 사건의 시작과 일곱 별과 일곱 금 촛대의 비밀'}
  ],
  verseData:[
    {num:3, ref:'계 1:1', hint:'', full:'예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 될 일을 그 종들에게 보이시려고 그 천사를 그 종 요한에게 보내어 지시하신 것이라'},
    {num:4, ref:'계 1:2', hint:'', full:'요한은 하나님의 말씀과 예수 그리스도의 증거 곧 자기의 본 것을 다 증거하였느니라'},
    {num:5, ref:'계 1:3', hint:'', full:'이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라'},
    {num:6, ref:'계 1:19', hint:'', full:'그러므로 네 본 것과 이제 있는 일과 장차 될 일을 기록하라'},
    {num:7, ref:'계 1:20', hint:'', full:'네 본 것은 내 오른손에 일곱 별의 비밀과 일곱 금 촛대라 일곱 별은 일곱 교회의 사자요 일곱 촛대는 일곱 교회니라'}

// ─── 유틸 ─────────────────────────────────────────────────────────────────────
function plain(s){ return s.replace(/\{([^}]+)\}/g,'$1'); }
function norm(s){ return (s||'').trim().replace(/\s+/g,''); }
function getCS(s){
  const c=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  return s.split('').map(ch=>{ const n=ch.charCodeAt(0)-44032; return(n>-1&&n<11172)?c[Math.floor(n/588)]:ch; }).join('');
}

let curExam=null, curKeys=null, curStage=null, allShown=false;

(()=>{
  const s=new URLSearchParams(location.search).get('stage');
  if(s) selectStage(s);
})();

function showModal(){ document.getElementById('selModal').style.display='flex'; }
function hideModal(){ document.getElementById('selModal').style.display='none'; }

function selectExam(n){
  curExam=n; curKeys=null; curStage=null;
  hideModal();
  document.getElementById('topBar').style.display='flex';
  document.getElementById('topBar2').style.display='none';
  renderStudy(n);
  renderExam(n);
  renderSpotMulti([n]);
  setMode('study');
}

function selectStage(s){
  curKeys=['1','2','3','4'].map(n=>s+'-'+n).filter(k=>EXAMS[k]);
  curExam=null; curStage=s;
  if(!curKeys.length) return;
  hideModal();
  document.getElementById('topBar').style.display='flex';
  document.getElementById('topBar2').style.display='none';
  renderStudyMulti(curKeys);
  renderExamMulti(curKeys);
  renderSpotMulti(curKeys);
  setMode('study');
}

function setMode(mode){
  document.getElementById('studyView').style.display=mode==='study'?'block':'none';
  document.getElementById('examView').style.display=mode==='exam'?'block':'none';
  document.getElementById('spotView').style.display=mode==='spot'?'block':'none';
  document.getElementById('resultView').style.display=mode==='result'?'block':'none';
  document.getElementById('globalBtn').style.display=mode==='study'?'inline-block':'none';
  document.getElementById('printBtn').style.display=mode==='exam'?'inline-block':'none';
  document.getElementById('printAnsBtn').style.display=mode==='exam'?'inline-block':'none';
  document.getElementById('partialBtn').style.display=mode==='exam'?'block':'none';
  document.getElementById('tabS').classList.toggle('active',mode==='study');
  document.getElementById('tabE').classList.toggle('active',mode==='exam');
  document.getElementById('tabP').classList.toggle('active',mode==='spot');
  scrollTo({top:0,behavior:'smooth'});
}

// ─── 학습 렌더링 ───────────────────────────────────────────────────────────────
function buildStudyHtml(ex, gi){
  let html='';
  ex.titleData.forEach(d=>{
    const id='sa-'+(gi.v++);
    html+=`<div class="card"><div class="qlabel">${d.num}. ${d.q}</div><div class="ans-block" id="${id}">${d.a}</div><div class="card-ctrl"><button class="btn-ans" onclick="toggleRev('${id}',this)">정답 보기</button></div></div>`;
  });
  if(ex.verseData.length){
    html+=`<div class="pdf-divider">* 다음 성구를 기록하시오.</div>`;
    ex.verseData.forEach(d=>{
      const id='sa-'+(gi.v++);
      const hint=d.hint?`<div class="hint-ln">📌 <strong>${d.hint}···</strong></div>`:'';
      html+=`<div class="card"><div class="qlabel">${d.num}. ${d.ref}</div>${hint}<div class="ans-block" id="${id}">${d.full}</div><div class="card-ctrl"><button class="btn-ans" onclick="toggleRev('${id}',this)">정답 보기</button></div></div>`;
    });
  }
  if(ex.blankData.length){
    html+=`<div class="pdf-divider">* 다음 성구의 괄호 속에 들어갈 말을 기록하시오.</div>`;
    ex.blankData.forEach(d=>{
      const cid='sb-'+(gi.v++);
      const body=d.raw.replace(/\{([^}]+)\}/g,(_,w)=>`<span class="blank" style="min-width:${Math.max(3,w.length*.75)}em" data-a="${w}" data-cs="${getCS(w)}" onclick="toggleBlank(this)">${w}</span>`);
      html+=`<div class="card"><div class="qlabel">${d.num}. ${d.ref}</div><div class="qbody" id="${cid}">${body}</div><div class="card-ctrl"><button class="btn-hint" onclick="cardHint('${cid}',this)">초성 보기</button><button class="btn-ans" onclick="cardAns('${cid}',this)">정답 보기</button></div></div>`;
    });
  }
  return html;
}

function renderStudy(n){
  const gi={v:0};
  document.getElementById('s-body').innerHTML=buildStudyHtml(EXAMS[n],gi);
}

function toggleSec(hd){
  const body=hd.nextElementSibling;
  if(!body||!body.classList.contains('sec-body'))return;
  const c=body.classList.toggle('collapsed');
  const caret=hd.querySelector('.caret');
  if(caret)caret.textContent=c?'▸':'▾';
}

function renderStudyMulti(keys){
  const gi={v:0};
  let html='';
  keys.forEach((key,kidx)=>{
    const ex=EXAMS[key];
    if(kidx>0) html+=`<div style="border-top:3px solid var(--p);margin:32px 0 20px"></div>`;
    html+=`<div class="sec-hd" style="margin-bottom:14px"><h2>▸ ${ex.label}</h2></div>`;
    html+=buildStudyHtml(ex,gi);
  });
  document.getElementById('s-body').innerHTML=html;
}

function renderExamMulti(keys){
  const ti={v:0},vi={v:0},qi={v:0};
  let html='';
  keys.forEach((key,kidx)=>{
    const ex=EXAMS[key];
    if(kidx>0) html+=`<div style="border-top:3px solid var(--p);margin:32px 0 20px"></div>`;
    html+=`<div class="sec-hd" style="margin-bottom:14px"><h2>▸ ${ex.label}</h2></div>`;
    html+=buildExamHtml(ex,ti,vi,qi);
  });
  document.getElementById('e-body').innerHTML=html;
}

// ─── 모의고사 렌더링 ───────────────────────────────────────────────────────────
function buildExamHtml(ex, ti, vi, qi){
  let html='';
  ex.titleData.forEach(d=>{
    html+=`<div class="ecard"><div class="eqlabel">${d.num}. ${d.q}</div><input type="text" class="line-inp" id="et-${ti.v++}" data-a="${d.a||''}" placeholder="장 제목을 입력하세요" autocomplete="off"></div>`;
  });
  if(ex.verseData.length){
    html+=`<div class="pdf-divider">* 다음 성구를 기록하시오.</div>`;
    ex.verseData.forEach(d=>{
      const hint=d.hint?`<div class="vhint">📌 <strong>${d.hint}···</strong></div>`:'';
      html+=`<div class="ecard"><div class="eqlabel">${d.num}. ${d.ref}</div>${hint}<textarea class="vtarea" id="ev-${vi.v++}" data-a="${d.full||''}" rows="4" placeholder="여기에 성구를 기록하세요">${d.hint||''}</textarea></div>`;
    });
  }
  if(ex.blankData.length){
    html+=`<div class="pdf-divider">* 다음 성구의 괄호 속에 들어갈 말을 성경대로 쓰시오. (부분점수 없음)</div>`;
    ex.blankData.forEach(d=>{
      let bi=0; const myQi=qi.v++;
      const body=d.raw.replace(/\{([^}]+)\}/g,(_,w)=>{const id=`eb-${myQi}-${bi}`;bi++;return `<input type="text" class="binp" id="${id}" data-a="${w}" style="width:${Math.max(3.5,w.length*.85)}em" autocomplete="off" onkeydown="bNav(event,this,${myQi},${bi-1})">`;});
      html+=`<div class="ecard"><div class="eqlabel">${d.num}. ${d.ref}</div><div class="ev-body">${body}</div></div>`;
    });
  }
  return html;
}

function renderExam(n){
  const ti={v:0},vi={v:0},qi={v:0};
  document.getElementById('e-body').innerHTML=buildExamHtml(EXAMS[n],ti,vi,qi);
}

function bNav(e,el,qi,idx){
  if(e.key!=='Enter')return;
  e.preventDefault();
  const nx=document.getElementById(`eb-${qi}-${idx+1}`);
  if(nx)nx.focus();
}

// ─── 채점 ─────────────────────────────────────────────────────────────────────
function submitExam(){
  let score=0,wrongs=[],total=0;
  const keys=curKeys||(curExam?[curExam]:[]);
  let ti=0,vi=0,qi=0;
  keys.forEach(key=>{
    const ex=EXAMS[key];
    total+=ex.total;
    ex.titleData.forEach(d=>{
      const u=document.getElementById('et-'+ti++).value;
      if(norm(u)===norm(d.a)){score++;}
      else wrongs.push({type:'title',label:`${d.num}. ${d.q}`,correct:d.a,user:u||'(미기재)'});
    });
    ex.verseData.forEach(d=>{
      const u=document.getElementById('ev-'+vi++).value;
      if(norm(u)===norm(d.full)){score++;}
      else wrongs.push({type:'verse',label:`${d.num}. ${d.ref}`,correct:d.full,user:u||'(미기재)'});
    });
    ex.blankData.forEach(d=>{
      const myQi=qi++;
      const inputs=document.querySelectorAll(`[id^="eb-${myQi}-"]`);
      let allOk=true; const brs=[];
      inputs.forEach(inp=>{
        const ok=norm(inp.value)===norm(inp.dataset.a);
        if(!ok)allOk=false;
        brs.push({u:inp.value,a:inp.dataset.a,ok});
      });
      if(allOk){score++;}
      else wrongs.push({type:'blank',label:`${d.num}. ${d.ref}`,brs});
    });
  });
  saveHistItem({ts:Date.now(),mode:'exam',stage:curStage,score,total});
  showResult(score,total,wrongs);
}

function submitPartial(){
  let score=0,wrongs=[],total=0;
  const keys=curKeys||(curExam?[curExam]:[]);
  let ti=0,vi=0,qi=0;
  keys.forEach(key=>{
    const ex=EXAMS[key];
    ex.titleData.forEach(d=>{
      const u=document.getElementById('et-'+ti++).value;
      if(!u.trim()) return; // 미입력 건너뜀
      total++;
      if(norm(u)===norm(d.a)){score++;}
      else wrongs.push({type:'title',label:`${d.num}. ${d.q}`,correct:d.a,user:u});
    });
    ex.verseData.forEach(d=>{
      const u=document.getElementById('ev-'+vi++).value;
      if(!u.trim()) return; // 미입력 건너뜀
      total++;
      if(norm(u)===norm(d.full)){score++;}
      else wrongs.push({type:'verse',label:`${d.num}. ${d.ref}`,correct:d.full,user:u});
    });
    ex.blankData.forEach(d=>{
      const myQi=qi++;
      const inputs=document.querySelectorAll(`[id^="eb-${myQi}-"]`);
      const anyFilled=[...inputs].some(inp=>inp.value.trim());
      if(!anyFilled) return; // 하나도 안 채웠으면 건너뜀
      total++;
      let allOk=true; const brs=[];
      inputs.forEach(inp=>{
        const ok=norm(inp.value)===norm(inp.dataset.a);
        if(!ok)allOk=false;
        brs.push({u:inp.value,a:inp.dataset.a,ok});
      });
      if(allOk){score++;}
      else wrongs.push({type:'blank',label:`${d.num}. ${d.ref}`,brs});
    });
  });
  if(total===0){alert('아직 입력한 답이 없습니다.'); return;}
  showResult(score,total,wrongs,'partial');
}

function showResult(score,total,wrongs,mode){
  const sb=document.getElementById('rScore');
  document.getElementById('rTotal').textContent=total;
  sb.textContent=score+' / '+total;
  sb.className='score-big'+(score===total?' perfect':'');

  const partialNote=document.getElementById('rPartialNote');
  if(partialNote) partialNote.textContent=mode==='partial'?'※ 입력한 문제만 채점 (미입력 제외)':'';
  const pct=Math.round(score/total*100);
  document.getElementById('rMsg').textContent=
    score===total?'🎉 만점! 완벽합니다!':
    pct>=88?'👍 훌륭해요! 마지막 오답만 잡으면 완벽':
    pct>=72?'📝 잘 하고 있어요! 오답 확인 후 재도전':
    '💪 더 연습해 봐요. 학습 모드로 돌아가 복습하세요.';

  const wl=document.getElementById('wrongList');
  wl.innerHTML='';
  if(wrongs.length===0){
    wl.innerHTML='<div class="wrong-sec"><p style="text-align:center;color:#198754;font-weight:bold">오답이 없습니다! 🎊</p></div>';
  } else {
    wrongs.forEach(w=>{
      let inner='';
      if(w.type==='title'){
        inner=`<div class="wlabel">❌ ${w.label}</div>
          <div>내 답: <span class="wrong-ans">${w.user}</span></div>
          <div>정답: <span class="corr">${w.correct}</span></div>`;
      } else if(w.type==='verse'){
        inner=`<div class="wlabel">❌ ${w.label}</div>
          <div style="margin-bottom:4px">내 답: <span class="wrong-ans" style="text-decoration:none">${w.user}</span></div>
          <div class="ans-box">${w.correct}</div>`;
      } else {
        const bHtml=w.brs.map(b=>b.ok?
          `<span class="ok-b">${b.a}</span>`:
          `<span class="wrong-ans">${b.u||'(빈칸)'}</span> → <span class="corr">${b.a}</span>`
        ).join(' / ');
        inner=`<div class="wlabel">❌ ${w.label}</div><div style="font-size:.9rem;line-height:2">${bHtml}</div>`;
      }
      wl.innerHTML+=`<div class="wrong-sec"><div class="wi">${inner}</div></div>`;
    });
  }
  document.getElementById('rRecent').innerHTML=recentHtml('exam',curStage,5);
  setMode('result');
}

// ─── 틀린 부분 찾기 ─────────────────────────────────────────────────────────────
function spotKeys(){ return curKeys||(curExam?[curExam]:[]); }

// 절의 핵심 단어 중 오답 풀에 있는 것들에서 1~3개를 무작위로 골라 '심을' 위치 결정
function choosePlants(raw,pool){
  const map=new Map();
  if(!pool||!pool.length) return map;
  const keyWords=[]; const re=/\{([^}]+)\}/g; let m,i=0;
  while((m=re.exec(raw))!==null){ keyWords.push({i:i++,w:m[1]}); }
  const used=new Set(), cand=[];
  pool.forEach(p=>{ const t=keyWords.find(k=>k.w===p.a&&!used.has(k.i)); if(t){ used.add(t.i); cand.push({i:t.i,a:p.a,w:p.w}); } });
  if(!cand.length) return map;
  const cap=Math.min(cand.length,3);
  const n=1+Math.floor(Math.random()*cap);
  cand.slice().sort(()=>Math.random()-0.5).slice(0,n).forEach(c=>map.set(c.i,c));
  return map;
}

// 절 하나를 렌더 — 핵심 단어만 탭 가능한 토큰으로, 심어진 곳은 오답 단어로 표시
function renderSpotVerse(d,pool){
  const plant=choosePlants(d.raw,pool); let i=0;
  return d.raw.replace(/\{([^}]+)\}/g,(_,w)=>{
    const idx=i++, p=plant.get(idx);
    return `<span class="tk" data-a="${w}" data-err="${p?'1':'0'}" onclick="tapTk(this)">${p?p.w:w}</span>`;
  });
}

function renderSpotMulti(keys){
  const bodyEl=document.getElementById('sp-body');
  const btn=document.getElementById('spSubmitBtn');
  document.getElementById('sp-summary').innerHTML='';
  let html='', any=false;
  (keys||[]).forEach(key=>{
    const ex=EXAMS[key]; if(!ex) return;
    const pool=SPOT[key]||{};
    const verses=ex.blankData.filter(d=>pool[d.num]&&pool[d.num].length);
    if(!verses.length) return;
    any=true;
    html+=`<div class="sec-hd" style="margin-top:24px"><h2>▸ ${ex.label}</h2></div>`;
    verses.forEach(d=>{
      html+=`<div class="ecard" data-num="${d.num}"><div class="eqlabel">${d.num}. ${d.ref}</div><div class="sp-body">${renderSpotVerse(d,pool[d.num])}</div></div>`;
    });
  });
  if(!any){
    bodyEl.innerHTML='<div class="ecard"><p style="text-align:center;color:var(--sub);margin:6px 0">이 단계의 「틀린 부분 찾기」 문제는 아직 준비 중입니다. 🛠️</p></div>';
    btn.style.display='none';
  }else{
    bodyEl.innerHTML=html;
    btn.style.display='block'; btn.textContent='🔍 채점하기';
  }
}

function tapTk(el){ if(!el.classList.contains('locked')) el.classList.toggle('flag'); }

function submitSpot(){
  const cards=document.querySelectorAll('#sp-body .ecard[data-num]');
  if(!cards.length) return;
  let total=0,okVerses=0,foundErr=0,totalErr=0,falsePos=0;
  cards.forEach(card=>{
    total++; let verseOk=true;
    card.querySelectorAll('.tk').forEach(tk=>{
      tk.classList.add('locked');
      const isErr=tk.dataset.err==='1', flagged=tk.classList.contains('flag');
      const a=tk.dataset.a, shown=tk.textContent;
      tk.classList.remove('flag');
      if(isErr){
        totalErr++;
        if(flagged){ foundErr++; tk.classList.add('ok-correct'); tk.innerHTML=`<s>${shown}</s> ${a}`; }
        else { verseOk=false; tk.classList.add('missed'); tk.innerHTML=`<s>${shown}</s> ${a}`; }
      }else if(flagged){
        falsePos++; verseOk=false; tk.classList.add('falsepos');
        tk.innerHTML=`${a} <span class="corr-note">(정답)</span>`;
      }
    });
    if(verseOk) okVerses++;
  });
  saveHistItem({ts:Date.now(),mode:'spot',stage:curStage,score:okVerses,total});
  const perfect=okVerses===total;
  const msg = perfect ? '🎉 완벽합니다! 숨은 오답을 모두 찾았어요.'
            : (foundErr===totalErr&&falsePos) ? '👍 오답은 다 찾았지만 맞는 단어도 눌렀어요.'
            : '💪 놓친 오답을 확인해 보세요.';
  document.getElementById('sp-summary').innerHTML=
    `<div class="sp-summary">
       <div class="score-lbl">총 ${total}절 중</div>
       <div class="big" style="color:${perfect?'#198754':'var(--p)'}">${okVerses} / ${total}</div>
       <div class="score-lbl">숨은 오답 ${foundErr}/${totalErr}개 찾음${falsePos?` · 잘못 누름 ${falsePos}개`:''}</div>
       <div style="margin:10px 0 4px;font-size:.95rem">${msg}</div>
       <button class="btn-retry" onclick="retrySpot()">🔄 새 문제로 다시</button>
       ${recentHtml('spot',curStage,5)}
     </div>`;
  document.getElementById('spSubmitBtn').style.display='none';
  scrollTo({top:0,behavior:'smooth'});
}

function retrySpot(){ renderSpotMulti(spotKeys()); scrollTo({top:0,behavior:'smooth'}); }

// ─── 시험 기록 (localStorage) ───────────────────────────────────────────────────
const HKEY='bj_history';
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HKEY))||[]; }catch(e){ return []; } }
function saveHistItem(rec){
  const h=loadHist(); h.push(rec);
  if(h.length>200) h.splice(0,h.length-200);      // 최근 200개만 보관
  try{ localStorage.setItem(HKEY,JSON.stringify(h)); }catch(e){}
}
function fmtTs(ms){
  const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function scoreColor(r){
  if(!r.total) return 'var(--sub)';
  if(r.score===r.total) return '#198754';
  return (r.score/r.total>=.7)?'var(--p)':'var(--red)';
}
function modeLabel(m){ return m==='exam'?'📝 모의고사':'🔍 틀린 부분'; }

// 결과/채점 화면에 붙는 '최근 기록'(같은 단계·유형, 2회 이상일 때만)
function recentHtml(mode,stage,n){
  const h=loadHist().filter(r=>r.mode===mode&&r.stage===stage);
  if(h.length<2) return '';
  const rows=h.slice(-n).reverse().map((r,i)=>
    `<div style="display:flex;justify-content:space-between;padding:5px 2px;border-top:1px solid var(--blank-bg);font-size:.85rem">
       <span style="color:var(--sub)">${fmtTs(r.ts)}${i===0?' <b style="color:var(--p)">(방금)</b>':''}</span>
       <b style="color:${scoreColor(r)}">${r.score}/${r.total}</b>
     </div>`).join('');
  return `<div style="margin-top:16px;text-align:left">
    <div style="font-size:.85rem;font-weight:bold;color:var(--p);margin-bottom:2px">📊 최근 기록 (이 단계·유형)</div>${rows}</div>`;
}

// 전체 기록 모달
function renderHist(){
  const body=document.getElementById('histBody');
  const h=loadHist();
  if(!h.length){ body.innerHTML='<p style="text-align:center;color:var(--sub);margin:20px 0">아직 기록이 없습니다.</p>'; return; }
  let html='<table style="width:100%;border-collapse:collapse;font-size:.85rem">'
    +'<tr style="color:var(--sub);text-align:left">'
    +'<th style="padding:4px 6px;font-weight:normal">일시</th>'
    +'<th style="padding:4px 6px;font-weight:normal">유형</th>'
    +'<th style="padding:4px 6px;font-weight:normal">단계</th>'
    +'<th style="padding:4px 6px;font-weight:normal;text-align:right">점수</th></tr>';
  h.slice().reverse().forEach(r=>{
    html+=`<tr style="border-top:1px solid var(--blank-bg)">
      <td style="padding:6px">${fmtTs(r.ts)}</td>
      <td style="padding:6px">${modeLabel(r.mode)}</td>
      <td style="padding:6px">${r.stage?r.stage+'단계':'-'}</td>
      <td style="padding:6px;text-align:right;font-weight:bold;color:${scoreColor(r)}">${r.score}/${r.total}</td>
    </tr>`;
  });
  html+='</table>';
  body.innerHTML=html;
}
function showHist(){ renderHist(); document.getElementById('histModal').style.display='flex'; }
function hideHist(){ document.getElementById('histModal').style.display='none'; }
function clearHist(){
  if(confirm('저장된 모든 시험 기록을 지울까요? (되돌릴 수 없습니다)')){
    localStorage.removeItem(HKEY); renderHist();
  }
}
